name: Deploy Iris website

on:
  push:
    branches: [master]
    paths:
      - 'site/**'
      - 'scripts/**'
      - 'package*.json'
      - '.node-version'
      - '.github/workflows/deploy-pages.yml'
  repository_dispatch:
    types: [iris-release]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      available: ${{ steps.release.outputs.available }}
      tag: ${{ steps.release.outputs.tag }}
    steps:
      - uses: actions/github-script@v8
        id: release
        with:
          script: |
            try {
              const { data } = await github.rest.repos.getLatestRelease({ owner: 'Tsubaki-01', repo: 'Iris' });
              core.setOutput('available', 'true');
              core.setOutput('tag', data.tag_name);
              await core.summary.addHeading('Iris 文档版本').addRaw(data.tag_name).write();
            } catch (error) {
              if (error.status !== 404) throw error;
              core.setOutput('available', 'false');
              await core.summary.addRaw('尚无正式 Release，未部署。可继续本地开发和 PR 预览。').write();
            }
  build:
    needs: version
    if: needs.version.outputs.available == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read
    steps:
      - uses: actions/checkout@v6
        with:
          ref: master
      - uses: actions/checkout@v6
        with:
          repository: Tsubaki-01/Iris
          ref: ${{ needs.version.outputs.tag }}
          path: .cache/iris
      - uses: actions/setup-node@v6
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - name: Prepare release content
        env:
          IRIS_VERSION: ${{ needs.version.outputs.tag }}
        run: npm run content:prepare -- --source .cache/iris --version "$IRIS_VERSION"
      - run: npm run build
      - name: Record source revisions
        run: |
          echo "Website commit: $(git rev-parse HEAD)" >> "$GITHUB_STEP_SUMMARY"
          echo "Iris commit: $(git -C .cache/iris rev-parse HEAD)" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: site/.vitepress/dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
